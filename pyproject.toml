[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sessionindex"
version = "0.1.0"
description = "Read-only metadata-only project inventory for audio-session recovery and handoff planning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel Garcia Alonso" }]
keywords = ["audio", "project", "inventory", "backup", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
sessionindex = "sessionindex.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sessionindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
